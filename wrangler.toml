# Cloudflare Worker for Bayyin's daily push notifications.
# The dashboard can build this straight from GitHub (Workers → Create application →
# Connect to Git → pick this repository); it reads this file.

name = "bayyin-push"
main = "worker/push-worker.js"
compatibility_date = "2025-06-01"

# Runs every minute, so a notification goes out in the same minute as its time
# (a 10-minute cron is what made them arrive 7-8 minutes late).
[triggers]
crons = ["* * * * *"]

# The KV namespace holds the push subscriptions and can also hold the three VAPID
# values (so a Git deploy cannot wipe them — wrangler resets dashboard bindings).
[[kv_namespaces]]
binding = "SUBS"
id = "11dcc8171f42495280cacd9b4e7ada93"

# Optional, if you prefer the dashboard: Settings → Runtime variables
#   VAPID_PUBLIC, VAPID_PRIVATE, VAPID_SUBJECT
# The Worker reads the environment first and then falls back to the KV entries
# VAPID_PUBLIC / VAPID_PRIVATE / VAPID_SUBJECT in the namespace above.

# Static files served by this Worker — today our own copy of the speech library
# (`/ort/transformers.min.js`), so the app asks no CDN for the code that runs its
# model. The folder is filled by the deploy workflow from the upstream package;
# nothing large is committed to git. `run_worker_first` keeps every request going
# through the Worker, which is what adds the CORS header the app needs.
[assets]
directory = "worker/public"
binding = "ASSETS"
run_worker_first = true
