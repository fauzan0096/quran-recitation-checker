# Cloudflare Worker for Bayyin's daily push notifications.
# The dashboard can build this straight from GitHub (Workers → Create application →
# Connect to Git → pick this repository); it reads this file.

name = "bayyin-push"
main = "worker/push-worker.js"
compatibility_date = "2025-06-01"

# One notification a day: the cron runs hourly and the Worker sends only when the
# person's own local hour matches (see worker/push-worker.js).
[triggers]
crons = ["0 * * * *"]

# The KV namespace holds the push subscriptions and can also hold the three VAPID
# values (so a Git deploy cannot wipe them — wrangler resets dashboard bindings).
[[kv_namespaces]]
binding = "SUBS"
id = "11dcc8171f42495280cacd9b4e7ada93"

# Optional, if you prefer the dashboard: Settings → Runtime variables
#   VAPID_PUBLIC, VAPID_PRIVATE, VAPID_SUBJECT
# The Worker reads the environment first and then falls back to the KV entries
# VAPID_PUBLIC / VAPID_PRIVATE / VAPID_SUBJECT in the namespace above.
