<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>update files</title>
    <style>
      body { font: 14px system-ui, -apple-system, sans-serif; margin: 12px; color: #2a1015; }
      h1 { font-size: 16px; }
      a { display: block; padding: 10px 4px; border-bottom: 1px solid #e2d6c6; color: #4a1622; font-weight: 600; text-decoration: none; }
      small { color: #7a6a5a; font-weight: 400; }
    </style>
  </head>
  <body>
    <h1 id="title">opening the update…</h1>
    <div id="list"></div>
    <script>
      const ZIP = 'quran-update.txt';
      const TEXT = /\.(html|js|css|md|json|webmanifest|txt|xml|svg)$/i;
      const listEl = document.getElementById('list');
      const titleEl = document.getElementById('title');
      const u16 = (v, at) => v.getUint16(at, true);
      const u32 = (v, at) => v.getUint32(at, true);

      function parseZip(buffer) {
        const view = new DataView(buffer);
        const bytes = new Uint8Array(buffer);
        let eocd = -1;
        for (let i = bytes.length - 22; i >= 0 && i > bytes.length - 70000; i -= 1) {
          if (u32(view, i) === 0x06054b50) {
            eocd = i;
            break;
          }
        }
        if (eocd < 0) throw new Error('not a zip file');
        const count = u16(view, eocd + 10);
        let at = u32(view, eocd + 16);
        const entries = [];
        for (let n = 0; n < count; n += 1) {
          if (u32(view, at) !== 0x02014b50) break;
          const method = u16(view, at + 10);
          const csize = u32(view, at + 20);
          const nameLen = u16(view, at + 28);
          const extraLen = u16(view, at + 30);
          const commentLen = u16(view, at + 32);
          const localAt = u32(view, at + 42);
          const name = new TextDecoder().decode(bytes.subarray(at + 46, at + 46 + nameLen));
          at += 46 + nameLen + extraLen + commentLen;
          if (!name || name.endsWith('/') || name.indexOf('__MACOSX') >= 0) continue;
          if (!TEXT.test(name)) continue;
          entries.push({ name, method, csize, localAt });
        }
        return { view, bytes, entries };
      }

      async function textOf(zip, entry) {
        const { view, bytes } = zip;
        const at = entry.localAt;
        const nameLen = u16(view, at + 26);
        const extraLen = u16(view, at + 28);
        const start = at + 30 + nameLen + extraLen;
        const raw = bytes.subarray(start, start + entry.csize);
        if (entry.method === 0) return new TextDecoder().decode(raw);
        const stream = new DecompressionStream('deflate-raw');
        const buffer = await new Response(new Blob([raw]).stream().pipeThrough(stream)).arrayBuffer();
        return new TextDecoder().decode(new Uint8Array(buffer));
      }

      async function run() {
        const response = await fetch(ZIP, { cache: 'no-store' });
        if (!response.ok) throw new Error('zip ' + response.status);
        const zip = parseZip(await response.arrayBuffer());
        titleEl.textContent = 'reading ' + zip.entries.length + ' files…';

        for (const entry of zip.entries) {
          const flat = entry.name.replace(/^[^/]+\//, '');
          let text = '';
          try {
            text = await textOf(zip, entry);
          } catch (error) {
            continue;
          }
          const link = document.createElement('a');
          link.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
          link.download = flat.split('/').pop();
          link.textContent = flat;
          const size = document.createElement('small');
          size.textContent = '  ' + Math.round(text.length / 1024) + ' KB';
          link.appendChild(size);
          listEl.appendChild(link);
        }
        titleEl.textContent = 'Tap a file to save it';
      }

      run().catch((error) => {
        titleEl.textContent = 'failed: ' + error.message;
      });
    </script>
  </body>
</html>
