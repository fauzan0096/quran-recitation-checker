name: Icons from icon-source.png

# Put your own icon in the repository as `icon-source.png` (any size, PNG/JPG).
# This workflow turns it into every size the app and the stores need:
#   512, 192, maskable 512 (padded on the icon's own background) and 180 for iOS.
# It runs only when icon-source.png changes and does nothing if the file is absent.

on:
  push:
    paths:
      - 'icon-source.png'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build all icon sizes from icon-source.png
        run: |
          set -euo pipefail
          if [ ! -f icon-source.png ]; then
            echo "No icon-source.png in the repository yet - nothing to do."
            exit 0
          fi

          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

          BG=$(convert icon-source.png -format '%[pixel:p{0,0}]' info:)
          echo "background sampled: $BG"

          convert icon-source.png -resize '512x512^' -gravity center -extent 512x512 icon-512.png
          convert icon-source.png -resize '192x192^' -gravity center -extent 192x192 icon-192.png
          convert icon-source.png -background "$BG" -resize '410x410' -gravity center -extent 512x512 icon-maskable-512.png
          convert icon-source.png -resize '180x180^' -gravity center -extent 180x180 apple-touch-icon.png

          file icon-512.png icon-192.png icon-maskable-512.png apple-touch-icon.png

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-512.png icon-192.png icon-maskable-512.png apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "Icons unchanged."
            exit 0
          fi
          git commit -m "Build the app icons from icon-source.png"
          git push
