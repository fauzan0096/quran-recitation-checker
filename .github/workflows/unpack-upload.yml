name: Unpack uploaded zip

on:
  push:
    paths:
      - '.github/workflows/unpack-upload.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack
        run: |
          rm -rf _upload
          mkdir -p _upload
          unzip -o -q quran-recitation-checker-main_fixed.zip -d _upload
          echo "===== top level ====="
          ls -la _upload
          echo "===== every file (bytes) ====="
          find _upload -type f -printf '%10s  %p\n' | sort -k2
          echo "===== images ====="
          find _upload -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) -printf '%10s  %p\n'
          echo "===== names only in the zip ====="
          diff -rq _upload . --exclude=.git --exclude=_upload --exclude='*.zip' --exclude='.github' 2>&1 | sed -n 's/^Only in \(.*\): \(.*\)$/+\1\/\2/p' | head -200
          echo "===== files that differ ====="
          diff -rq _upload . --exclude=.git --exclude=_upload --exclude='*.zip' --exclude='.github' 2>&1 | grep '^Files' | head -200

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f _upload
          git commit -m "Unpack uploaded zip (inspection)" || true
          git push
