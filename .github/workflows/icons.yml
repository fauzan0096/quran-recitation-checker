name: Render PNG icons

# One-off: the chat agent cannot rasterise SVG locally, so this job converts the
# SVG icon sources into the PNG sizes Play Store / iOS and the manifest need.
# It exits immediately once the PNGs exist, and is deleted afterwards.

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert SVG icons to PNG
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          rsvg-convert -w 512 -h 512 icon.svg -o icon-512.png
          rsvg-convert -w 192 -h 192 icon.svg -o icon-192.png
          rsvg-convert -w 512 -h 512 icon-maskable.svg -o icon-maskable-512.png
          rsvg-convert -w 180 -h 180 icon-maskable.svg -o apple-touch-icon.png
          file icon-512.png icon-192.png icon-maskable-512.png apple-touch-icon.png

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-512.png icon-192.png icon-maskable-512.png apple-touch-icon.png
          if git diff --cached --quiet; then
            echo "Icons already present."
            exit 0
          fi
          git commit -m "Render PNG app icons from the SVG sources"
          git push
